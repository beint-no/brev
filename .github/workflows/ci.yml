name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: '26'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build, test, and verify publications
        run: ./gradlew clean build publishToMavenLocal
      - name: Build benchmark executable
        run: ./gradlew :benchmark:jmhJar
